# Test profile: in-memory H2 instead of a local MySQL so `gradle test`
# runs anywhere (locally and in CI) without external services.
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.data.rest.base-path=/api/v1/manage
