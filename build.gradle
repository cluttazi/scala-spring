plugins {
    id 'scala'
    id 'application'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chrisluttazi'
version = '1.0.0-SNAPSHOT'

base {
    archivesName = 'se-scala-movie'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.chrisluttazi.sescalamovie.WebApplication'
}

repositories {
    mavenCentral()
}

ext {
    scalaVersion = '2.13.18'
    scalatestVersion = '3.2.20'
    jjwtVersion = '0.13.0'
}

dependencies {
    implementation "org.scala-lang:scala-library:${scalaVersion}"

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // HAL explorer (successor of the discontinued hal-browser)
    implementation 'org.springframework.data:spring-data-rest-hal-explorer'

    // JWT (replaces the abandoned spring-security-token-filter starter)
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Persistence
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.scalatest:scalatest_2.13:${scalatestVersion}"
    testImplementation "org.scalatestplus:junit-4-13_2.13:${scalatestVersion}.0"
    testRuntimeOnly 'com.h2database:h2'
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = ['-deprecation', '-feature']
}

test {
    // ScalaTest suites run through the JUnit 4 runner (@RunWith(JUnitRunner))
    useJUnit()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
